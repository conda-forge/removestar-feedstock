schema_version: 1

context:
  name: removestar
  version: "1.5.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: c3a717fa5906a3a48ed410635d3375f3884da0c99e76ac83cbd613617903c038

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - removestar = removestar.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - pyflakes

tests:
  - python:
      imports:
        - removestar
      pip_check: false
      python_version: ${{ python_min }}.*
  - script:
      - removestar --help

about:
  license: MIT
  license_file: LICENSE
  summary: |
    removestar is a tool to automatically replace 'import *' in Python files with explicit imports.
  description: |
    removestar is a tool to automatically replace 'import *' in Python files with explicit imports.
  homepage: https://asmeurer.com/removestar
  repository: https://github.com/asmeurer/removestar
  documentation: https://asmeurer.com/removestar

extra:
  recipe-maintainers:
    - asmeurer
    - Saransh-cpp
